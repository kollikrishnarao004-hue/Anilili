name: Prepare Lab APK

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed source commit on the public fork main branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lab-release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'kollikrishnarao004-hue/Anilili-Lab-Releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_RELEASE_WORKFLOW_SHA: ${{ github.sha }}
      LAB_KEYSTORE_PASSWORD: ${{ secrets.LAB_KEYSTORE_PASSWORD }}
      LAB_KEY_ALIAS: ${{ secrets.LAB_KEY_ALIAS }}
      LAB_KEY_PASSWORD: ${{ secrets.LAB_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: kollikrishnarao004-hue/Anilili
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
      - name: Verify reviewed source revision
        env:
          LAB_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$LAB_SOURCE_COMMIT"
          test "$(gh api repos/kollikrishnarao004-hue/Anilili/branches/main --jq .commit.sha)" = "$LAB_SOURCE_COMMIT"
      - name: Restore permanent signing key
        env:
          LAB_KEYSTORE_BASE64: ${{ secrets.LAB_KEYSTORE_BASE64 }}
        run: |
          test -n "$LAB_KEYSTORE_BASE64"
          test -n "$LAB_KEYSTORE_PASSWORD"
          test -n "$LAB_KEY_ALIAS"
          test -n "$LAB_KEY_PASSWORD"
          umask 077
          LAB_KEYSTORE_PATH="$RUNNER_TEMP/anilili-lab.jks"
          printf 'LAB_KEYSTORE_PATH=%s\n' "$LAB_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$LAB_KEYSTORE_BASE64" | base64 --decode > "$LAB_KEYSTORE_PATH"
      - name: Resolve candidate identity
        id: version
        run: python3 scripts/lab_release.py version --github-output "$GITHUB_OUTPUT"
      - name: Test, lint and build signed release
        env:
          GITHUB_SHA: ${{ steps.version.outputs.commit }}
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:testMobileReleaseUnitTest :app:lintVitalMobileRelease :app:assembleMobileRelease
      - name: Release packaging regression tests
        run: python3 -m unittest discover -s scripts -p test_lab_release.py
      - name: Verify and package exact release bytes
        run: python3 scripts/lab_release.py prepare --apk app/build/outputs/apk/mobile/release/Anilili.apk
      - name: Create reviewable draft, without publishing
        env:
          LAB_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$LAB_TAG" build/lab-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Anilili Lab $LAB_TAG" --notes-file release-notes.md
          printf 'Draft prepared: %s. Publication requires a separate approval.\n' "$LAB_TAG" >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/lab-release/lab-update.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab-build-record-${{ steps.version.outputs.versionCode }}
          path: |
            build/lab-release/
            app/build/outputs/mapping-archive/
            app/build/reports/tests/
            app/build/reports/lint*
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: rm -f "${LAB_KEYSTORE_PATH:-$RUNNER_TEMP/anilili-lab.jks}"
