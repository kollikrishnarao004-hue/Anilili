name: Publish approved Lab APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact prepared draft tag, e.g. lab-v0.1.85-build97
        required: true
        type: string
      approval:
        description: Repeat the exact tag to approve publishing this private build to authorized phones
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the exact lab-update.json reviewed with this handoff
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lab-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kollikrishnarao004-hue/Anilili-Lab-Releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_TAG: ${{ inputs.tag }}
      LAB_APPROVAL: ${{ inputs.approval }}
      LAB_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: kollikrishnarao004-hue/Anilili
          ref: main
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;35.0.1'
      - name: Verify approval and publish existing signed bytes
        run: |
          test "$LAB_TAG" = "$LAB_APPROVAL"
          python3 scripts/lab_release.py publish --tag "$LAB_TAG" --expected-manifest-sha256 "$LAB_MANIFEST_SHA256"
          printf 'Published approved build: %s\n' "$LAB_TAG" >> "$GITHUB_STEP_SUMMARY"
